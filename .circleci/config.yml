version: 2.1

jobs:
  initWithBlock:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: T5 optimization
          command: |
            mkdir -p /tmp/stage-02
            set +o pipefail 2>/dev/null; printf '%*s' 1284124 'x' | tr ' ' 'x' > /tmp/stage-02/7w; true
            echo "q2-smoke | /tmp/stage-02/7w | $(wc -c </tmp/stage-02/7w)"
      - persist_to_workspace:
          root: /tmp/stage-02
          paths:
            - '7w'
  q2-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage-02
      - run:
          name: Revalidate
          command: |
            # simple report
            if [ -s /tmp/stage-02/7w ]; then
              echo "size: $(wc -c < /tmp/stage-02/7w)"
              echo "hash: $(md5sum /tmp/stage-02/7w | cut -c1-8)"
            else
              echo "empty"
            fi
      - run:
          name: Retrieve codebase
          command: git clone --depth 1 --quiet --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull static data
          command: gunzip -c data-stage.tgz | tar xf -
      - run:
          name: Finalize build
          command: sleep 15
      - run:
          command: ./checker-cli && true
